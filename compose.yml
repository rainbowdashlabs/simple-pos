services:
  spring_dev:
    build: .
    profiles:
      - dev
    ports:
      - 8888:8080
    environment:
      DEMO_ENABLED: true
      SECURITY_JWT_SECRET_KEY: ${SECURITY_JWT_SECRET_KEY:?set it in .env}
      SIMPLE_POS_DB_PASSWORD: ${SIMPLE_POS_DB_PASSWORD:?set it in .env}
    volumes:
      - ./application.yaml:/app/application.yaml
  spring:
    image: ghcr.io/rainbowdashlabs/simple-pos:latest@sha256:8121564a42e49a16b629b506d6013158934ed319c93199b94f235c89bb490a37
    environment:
      SECURITY_JWT_SECRET_KEY: ${SECURITY_JWT_SECRET_KEY:?set it in .env}
      SIMPLE_POS_DB_PASSWORD: ${SIMPLE_POS_DB_PASSWORD:?set it in .env}
    volumes:
      - ./application.yaml:/app/application.yaml
    profiles:
      - prod
  postgres:
    image: postgres:18@sha256:b9f6b8ff03b62f3cfd9d9ba3fe56226a9991c79d3fb46fd46536263bf02be553
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      SIMPLE_POS_DB_PASSWORD: ${SIMPLE_POS_DB_PASSWORD:?set it in .env}
    volumes:
      - ./postgres/init-app-role.sh:/docker-entrypoint-initdb.d/init-app-role.sh:ro
    ports:
      - 127.0.0.1:5434:5432
