services:
  spring_dev:
    build: .
    profiles:
      - dev
    ports:
      - 8888:8080
    environment:
      DEMO_ENABLED: true
      SECURITY_JWT_SECRET_KEY: ${SECURITY_JWT_SECRET_KEY:?set it in .env}
      SIMPLE_POS_DB_PASSWORD: ${SIMPLE_POS_DB_PASSWORD:?set it in .env}
    volumes:
      - ./application.yaml:/app/application.yaml
  spring:
    image: ghcr.io/rainbowdashlabs/simple-pos:latest@sha256:efc287345776f19eb32f796ea9818a6cafae4a0296edd17439838cb2a749b148
    environment:
      SECURITY_JWT_SECRET_KEY: ${SECURITY_JWT_SECRET_KEY:?set it in .env}
      SIMPLE_POS_DB_PASSWORD: ${SIMPLE_POS_DB_PASSWORD:?set it in .env}
    volumes:
      - ./application.yaml:/app/application.yaml
    profiles:
      - prod
  postgres:
    image: postgres:18@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      SIMPLE_POS_DB_PASSWORD: ${SIMPLE_POS_DB_PASSWORD:?set it in .env}
    volumes:
      - ./postgres/init-app-role.sh:/docker-entrypoint-initdb.d/init-app-role.sh:ro
    ports:
      - 127.0.0.1:5434:5432
