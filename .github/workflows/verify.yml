name: Verify

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-backend:
    runs-on: ubuntu-latest
    name: Verify Gradle Build Backend
    needs:
      - build-frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install npm dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Build with Gradle
        run: ./gradlew --build-cache test build
        working-directory: backend

  build-frontend:
    runs-on: ubuntu-latest
    name: Verify Npm Build Frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build static page
        run: npm run build
        working-directory: frontend

  build-docker:
    runs-on: ubuntu-latest
    name: Verify Docker Build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build as Docker image
        run: docker build .
