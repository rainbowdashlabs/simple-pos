[versions]
spring-boot = "4.1.2"
springdoc = "3.2.0"
testcontainers = "2.0.5"

[libraries]
# Spring Boot starters
spring-boot-starter-data-jpa = { group = "org.springframework.boot", name = "spring-boot-starter-data-jpa" }
spring-boot-starter-web = { group = "org.springframework.boot", name = "spring-boot-starter-web" }
spring-boot-starter-validation = { group = "org.springframework.boot", name = "spring-boot-starter-validation" }
spring-boot-starter-security = { group = "org.springframework.boot", name = "spring-boot-starter-security" }
spring-boot-starter-test = { group = "org.springframework.boot", name = "spring-boot-starter-test" }
spring-boot-testcontainers = { group = "org.springframework.boot", name = "spring-boot-testcontainers" }
spring-security-web = { group = "org.springframework.security", name = "spring-security-web" }
spring-security-config = { group = "org.springframework.security", name = "spring-security-config" }
spring-security-oauth2-resource-server = { group = "org.springframework.security", name = "spring-security-oauth2-resource-server" }
spring-security-oauth2-jose = { group = "org.springframework.security", name = "spring-security-oauth2-jose" }

# Database
postgresql = { group = "org.postgresql", name = "postgresql" }
spring-boot-starter-flyway = { group = "org.springframework.boot", name = "spring-boot-starter-flyway" }
flyway-postgresql = { group = "org.flywaydb", name = "flyway-database-postgresql" }

# OpenAPI
springdoc-openapi = { group = "org.springdoc", name = "springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

# Database testing
testcontainers-postgres = { group = "org.testcontainers", name = "testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-core = { group = "org.testcontainers", name = "testcontainers", version.ref = "testcontainers" }
testcontainers-junit = { group = "org.testcontainers", name = "testcontainers-junit-jupiter", version.ref = "testcontainers" }

# Test
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }

[bundles]
spring-security = [
    "spring-security-web",
    "spring-security-config",
    "spring-security-oauth2-resource-server",
    "spring-security-oauth2-jose"
]
testcontainers = [
    "testcontainers-core",
    "testcontainers-junit",
    "testcontainers-postgres"
]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
