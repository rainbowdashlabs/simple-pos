spring:
  application:
    name: simple-pos
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 8080
  forward-headers-strategy: native

spring.web.resources:
  static-locations: file:/app/public/,classpath:/public/

springdoc:
  api-docs:
    path: /api-docs
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: info
    org.springframework.web.servlet.PageNotFound: error

demo:
  enabled: false

security:
  jwt:
     # 1h in millisecond
     expiration-time: 3600000
     refresh-expiration-time: 2592000000
