spring:
  application:
    name: simple-pos
  autoconfigure:
    exclude:
      - org.springdoc.core.configuration.SpringDocDataRestConfiguration
      - org.springdoc.core.configuration.SpringDocHateoasConfiguration
  datasource:
    url: "jdbc:postgresql://0.0.0.0/postgres"
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        enable_lazy_load_no_trans: true
    show-sql: false
    hibernate:
      ddl-auto: update

  data:
    rest:
      base-path: /api
      detection-strategy: annotated
  jackson:
#    serialization:
#      write-date-timestamps-as-nanoseconds: true
#    deserialization:
#      read-date-timestamps-as-nanoseconds: true

server:
  port: 8080

spring.web.resources:
  static-locations: file:/app/public/,classpath:/public/

springdoc:
  api-docs:
    path: /api-docs
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: info
    org.springframework.web.servlet.PageNotFound: error

demo:
  enabled: false

security:
  jwt:
     # 1h in millisecond
     expiration-time: 3600000
     refresh-expiration-time: 2592000000
